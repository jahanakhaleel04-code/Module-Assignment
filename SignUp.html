<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SignUp</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css">

<body>
    <nav class="navbar navbar-expand-lg  bg-transparent navbar-light  w-100 bg-light">
        <div class="container">
            <a class="navbar-brand" href="#">
                <img src="images/logo.png" alt="Bootstrap" width="100" height="80">
            </a>
        </div>
    </nav>
    <section class="min-vh-100 d-flex align-items-center justify-content-center my-2">

        <div class="container">
            <div class="row  d-flex justify-content-center align-items-center">
                <div class="col-lg-8 col-xl-6">
                    <div
                        class="card card-reg shadow-lg p-3 mb-5 bg-body-tertiary rounded  d-flex justify-content-center align-items-center rounded-3">
                        <img src="images/pexels-alfonso-escalante-1319242-2832251.jpg" alt="travel image"
                            class="img-fluid rounded mx-auto d-block card-img-top">

                        <div class="card-body p-4 p-md-5">

                            <!-- <img src="images/logo.png" alt="Bootstrap" class="m-4" width="120" height="100"> -->
                            <h2 class="text-center mb-4 mt-4">
                                Registration From
                            </h2>

                            <form class="row g-3" id="regForm">
                                <div class="col-md-6">
                                    <label for="name" class="form-label">Full Name <span
                                            class="required">*</span></label>
                                    <input type="text" class="form-control" id="name">
                                </div>
                                <div class="col-md-6">
                                    <label for="email" class="form-label">Email <span class="required">*</span></label>
                                    <input type="text" class="form-control" id="email">
                                    <span>
                                        <p id="emailErr"></p>
                                    </span>
                                </div>
                                <div class="col-6">
                                    <label for="phone" class="form-label">Phone Number <span
                                            class="required">*</span></label>
                                    <input type="number" class="form-control" id="phone">
                                    <span>
                                        <p id="phoneErr"></p>
                                    </span>
                                </div>
                                <div class="col-6">
                                    <label for="city" class="form-label">City <span class="required">*</span></label>
                                    <input type="text" class="form-control" id="city">
                                    <span>
                                        <p id="cityErr"></p>
                                    </span>
                                </div>
                                <div class="col-md-6 mt-4">
                                    <div class="input-group">
                                        <input type="password" class="form-control" id="password"
                                            placeholder="Password">
                                        <button class="btn btn-outline-secondary" type="button" id="showPasswordBtn"> <i
                                                class="fa-solid fa-eye"></i></button>
                                    </div>
                                </div>
                                <div class="col-md-6 mt-4">
                                    <input type="password" class="form-control" id="confirmPassword"
                                        placeholder="Confirm Password">
                                </div>
                                <div class="col-md-12"> <span>
                                        <p id="passwordErr"></p>
                                    </span></div>
                                <div class="col-12">
                                    <button type="submit" class="btn btn-primary"  id="signUpBtn">Sign
                                        in</button>
                                </div>
                            </form>
                            <p class="mt-4 text-center">Have already an account ? <a href="SignIn.html">Login Here</a></p>
                        </div>


                    </div>

                </div>
            </div>
        </div>
        </div>
    </section>
    <script src="js/script.js"></script>
</body>

</html>
