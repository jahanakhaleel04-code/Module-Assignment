<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SignIn</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css">

<body>
    <nav class="navbar navbar-expand-lg  bg-transparent navbar-light  w-100 bg-light">
        <div class="container">
            <a class="navbar-brand" href="#">
                <img src="images/logo.png" alt="Bootstrap" width="100" height="80">
            </a>
        </div>
    </nav>
    <section class=" d-flex align-items-center justify-content-center my-2">

        <div class="container my-5">
            <div class="card card-login mb-3 my-5 v-75">
                <div class="row">
                    <div class="col-md-8">
                        <img src="images/pexels-nubikini-385997.jpg" class="img-fluid rounded h-100 w-100"
                            alt="travel image">
                    </div>
                    <div class="col-md-4 d-flex align-items-center justify-content-center">
                        <div class="card-body p-4 ">
                            <h3 class="card-title mb-5">Login</h3>
                            <form id="loginForm">
                                <div class="mb-3">
                                    <label for="email" class="form-label">Email address</label>
                                    <input type="email" class="form-control" id="loginEmail"
                                        aria-describedby="emailHelp">
                                        <span id="emailErr"></span>
                                </div>
                                <div class="mb-3">
                                    <label for="password" class="form-label">Password</label>
                                    <input type="password" class="form-control" id="loginPassword">
                                    <span id="passErr"></span>
                                </div>
                                <!-- <div class="mb-3 form-check">
                                    <input type="checkbox" class="form-check-input" id="exampleCheck1">
                                </div> -->
                                <button type="submit" class="btn btn-primary" id="signInBtn">Submit</button>
                            </form>
                            <p class="mt-4 text-center"><a href="SignUp.html">Create an account</a></p>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </section>

    <script src="js/script.js"></script>
</body>

</html>
